<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineViet — Đang xem: Bóng Tối Vô Tận</title>
<style>
/*
  DESIGN.md sections illustrated:
    - Colors (background, surface, text-primary — ultra-minimal palette)
    - Typography (scale-base for title, scale-sm for controls)
    - Components: Video Player (fullscreen, overlay controls)
    - Do's and Don'ts: minimal UI, film is center stage
  EXPERIENCE.md sections illustrated:
    - Information Architecture (/watch/[id] route)
    - Component Patterns: Video Player (fullscreen, overlay controls visible state)
    - State Patterns: controls visible (auto-hides after 3s on real implementation)
    - Interaction Primitives: controls fade behavior (shown as static visible state)
    - Key Flows: Flow 1 step 6 (Xem phim fullscreen — climax)
*/

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --text-primary: #f5f5f5;
  --text-secondary: #a3a3a3;
  --primary: #d97706;
  --font: 'Inter', system-ui, sans-serif;
  --radius-md: 6px;
  --radius-full: 9999px;
}

html, body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font);
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

/* ─── FULLSCREEN PLAYER WRAPPER ─── */
.player-wrapper {
  position: relative;
  width: 100%;
  height: 100vh;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ─── VIDEO AREA (16:9 iframe placeholder) ─── */
.video-area {
  position: relative;
  width: 100%;
  /* 16:9 that fits the viewport */
  aspect-ratio: 16/9;
  max-height: 100vh;
  max-width: calc(100vh * 16/9);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 1rem;
}

/* Subtle film-grain texture simulation */
.video-area::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, #1a1a1a 0%, #0d0d0d 60%, #050505 100%);
  opacity: 0.9;
}

.video-play-icon {
  position: relative;
  z-index: 1;
  width: 72px;
  height: 72px;
  border-radius: var(--radius-full);
  border: 2px solid rgba(245,245,245,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.75rem;
  color: rgba(245,245,245,0.4);
}

.video-label {
  position: relative;
  z-index: 1;
  font-size: 0.8125rem;
  color: rgba(245,245,245,0.2);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* ─── OVERLAY CONTROLS ─── */
/* Note: Controls auto-hide after 3s idle in real implementation.
   This mockup shows the visible state. */

.controls-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.5rem;
  background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 100%);
}

.ctrl-back {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--text-primary);
  font-size: 0.9375rem;
  cursor: pointer;
  opacity: 0.9;
}

.ctrl-back:hover { opacity: 1; }

.ctrl-title {
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--text-primary);
  opacity: 0.9;
}

.ctrl-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
  color: var(--text-primary);
  font-size: 1rem;
  opacity: 0.9;
}

.ctrl-btn {
  cursor: pointer;
  opacity: 0.85;
  font-size: 1.125rem;
}

/* ─── ANNOTATION ─── */
.annotation {
  position: absolute;
  top: 5rem;
  left: 1.5rem;
  z-index: 20;
  background: rgba(217,119,6,0.12);
  border: 1px solid rgba(217,119,6,0.3);
  border-radius: var(--radius-md);
  padding: 0.375rem 0.75rem;
  font-size: 0.75rem;
  color: var(--primary);
  pointer-events: none;
}

</style>
</head>
<body>

<div class="player-wrapper">

  <!-- VIDEO PLACEHOLDER -->
  <div class="video-area">
    <div class="video-play-icon">▶</div>
    <span class="video-label">Video Embed (YouTube / Direct URL)</span>
  </div>

  <!-- TOP OVERLAY CONTROLS (visible state) -->
  <div class="controls-top">
    <div class="ctrl-back">← Quay lại</div>
    <div class="ctrl-title">Bóng Tối Vô Tận</div>
    <div class="ctrl-actions">
      <span class="ctrl-btn" title="Toàn màn hình">⛶</span>
    </div>
  </div>

  <!-- ANNOTATION: developer note -->
  <div class="annotation">Controls auto-hide sau 3s idle · Hiện lại khi di chuột / chạm màn hình</div>

</div>

</body>
</html>
